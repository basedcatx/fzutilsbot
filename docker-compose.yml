services:
  app:
    build: .
    container_name: fzutils
    env_file:
      - ./.env
    environment:
      - PRODUCTION=true
    depends_on:
      - redis-db
    networks:
      - fznet
    ports:
      - "3000:3000"

  postgres:
    image: postgres:alpine
    container_name: fzpostgres
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    networks:
      - fznet
    volumes:
      - pg_volume:/var/lib/postgresql/:rw
      - ./postgres/postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_statement=none",
      ]
    user: "70:70"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}" -h localhost || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 120s
    shm_size: 512mb
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    labels:
      - "com.docker.compose.service=postgres"
      - "maintainer=basedcatx@gmail.com"

  pgadmin:
    image: elestio/pgadmin:latest
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    env_file:
      - ./.env
    volumes:
      - pgadmin_volume:/var/lib/pgadmin:rw
    depends_on:
      - postgres
    networks:
      - fznet

  redis-db:
    image: redis:latest
    container_name: fzstorage
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fznet
    restart: unless-stopped

volumes:
  pg_volume:
    driver: local
  pgadmin_volume:
    driver: local
  redis_data:
    driver: local

networks:
  fznet:
