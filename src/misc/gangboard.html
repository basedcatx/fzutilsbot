<!doctype html>
<html>
  <head>
  <script src="script.js"></script>
  </head>
  <body style="background-color: #1c1d1d">

      <div id="container" />

  </body>

  <script>

  // first we need to create a stage
  const stage = new Konva.Stage({
    container: 'container', // id of container <div>
    width: 800,
    height: 600,
  });

  // then create layer
  var layer = new Konva.Layer();

  // create our shape


  Konva.Image.fromURL("https://placehold.co/80x80", function (node) {
    node.setAttrs({
      scaleX: 2, scaleY: 2, cornerRadius: 50
    })
    firstGroup.add(node)
  })

  Konva.Image.fromURL("https://placehold.co/80x80", function (node) {
    node.setAttrs({
      scaleX: 2, scaleY: 2, cornerRadius: 50,
    })
    secondGroup.add(node)
  })

   Konva.Image.fromURL("https://placehold.co/80x80", function (node) {
    node.setAttrs({
      scaleX: 2, scaleY: 2, cornerRadius: 50
    })
    thirdGroup.add(node)
  })
  
  const firstGroup = new Konva.Group({
    x: 50,
    y: 100
  })
  const secondGroup = new Konva.Group({
    x: stage.width() / 2,
    y: 100,
  })
  const thirdGroup = new Konva.Group({
    x: 700,
    y: 100
  })

  layer.add(firstGroup, secondGroup, thirdGroup)

  // add the layer to the stage
  stage.add(layer);

  </script>
</html>
