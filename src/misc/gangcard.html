<!doctype html>
<html>
  <body style="background-color: #1c1d1d">
    <canvas
      id="myCanvas"
      width="1280"
      height="705"
      style="border: 1px solid #171614"
    >
      Your browser does not support the HTML canvas tag.
    </canvas>
  </body>

  <script>

    const CANVAS_WIDTH = 1280, CANVAS_HEIGHT = 705;
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");
    const colors = {
      primary: "#e7deca",
      secondary: "#e9e1cf",
      neutral: "#ffeffe",
      bg_card: "#2e2c28",
      bg_on_card: "#45433d",
    };


    function drawActivityRect(ctx) {
      const barMinHeight = 2
      const barMaxHeight = 134
      const PADDING = 8
      const BOXSIZE = 73
      let BOXMARGIN = 33
      // test values

      const values = [100, 200, 90, 80, 500, 20, 10]

      const calcValue = (val) => {
        const softLimit = 5000
        // math.max here to prevent it from going below
        return barMinHeight + (barMaxHeight - barMinHeight) * ((Math.log(Math.min(val, softLimit) + 1)/Math.log(softLimit + 1)))
      }

      values.forEach((val, index) => {
        values[Math.max(0, index - 1)] >= val ? ctx.fillStyle = colors.neutral : ctx.fillStyle = colors.primary
        ctx.fillRect(BOXMARGIN + index, 133 * 5 - calcValue(val), BOXSIZE, CANVAS_HEIGHT);
        BOXMARGIN += (BOXSIZE + PADDING)
      })
    }

    ctx.strokeStyle = colors.primary;

    ctx.fillStyle = colors.bg_card;
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT / 3);
    ctx.strokeRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT / 3);
    ctx.font = "20px Arial";
    ctx.fillStyle = colors.secondary;
    ctx.fillText("Gang", 30, 58);
    ctx.font = "bold italic 60px Arial";
    ctx.fillStyle = colors.neutral;
    ctx.fillText("Cursed Stepkids", 30, 110);


    ctx.fillStyle = colors.bg_on_card;
    ctx.fillRect(0, CANVAS_HEIGHT / 3, CANVAS_WIDTH, CANVAS_HEIGHT / 3);
    ctx.strokeRect(0, CANVAS_HEIGHT / 3, CANVAS_WIDTH, CANVAS_HEIGHT / 3);
    ctx.font = "15px Arial"
    ctx.fillStyle = colors.secondary
    ctx.fillText("Total message count", 30, (CANVAS_HEIGHT / 3) * 1.2)
    ctx.font = "bold 100px Arial"
    ctx.fillStyle = colors.neutral
    ctx.fillText("95,000", 30, (CANVAS_HEIGHT / 3) * 1.6)
    ctx.font = "30px Arial"
    ctx.fillStyle = colors.primary
    ctx.fillText("Msgs", 350, (CANVAS_HEIGHT / 3) * 1.6)

    // second box
    ctx.fillStyle = colors.bg_on_card;
    ctx.fillRect(0, (CANVAS_HEIGHT / 3) * 2, CANVAS_WIDTH, CANVAS_HEIGHT / 3);
    ctx.strokeRect(0, (CANVAS_HEIGHT / 3) * 2, CANVAS_WIDTH, CANVAS_HEIGHT / 3);
    ctx.fillStyle = colors.bg_card
    ctx.fillRect(370, 148, 80, 25)
    ctx.font = "15px Arial"
    ctx.fillStyle = colors.secondary
    ctx.fillText("Ranking", (CANVAS_WIDTH / 2) + 30,(CANVAS_HEIGHT / 3) * 1.2)
    ctx.font = "bold 100px Arial"
    ctx.fillStyle = colors.primary
    ctx.fillText("#450", (CANVAS_WIDTH / 2) + 30, (CANVAS_HEIGHT / 3) * 1.6)
    ctx.font = "bold 20px Arial"
    ctx.fillStyle = colors.neutral
    ctx.fillText("/ 600", (CANVAS_WIDTH / 2) * 1.4, (CANVAS_HEIGHT / 3) * 1.6)
    ctx.font = "bold 13px Arial"
    ctx.fillStyle = colors.neutral
    ctx.fillText("+12 positions (24H)", (CANVAS_WIDTH / 2) + 30, (CANVAS_HEIGHT / 3) * 1.75)
    
    ctx.fillText("Leader", (CANVAS_WIDTH / 2) + 30,(CANVAS_HEIGHT / 3) * 2.2)
    ctx.font = "bold 80px Arial"
    ctx.fillText("FATHA", (CANVAS_WIDTH / 2) + 30,(CANVAS_HEIGHT / 3) * 2.5)

    // center line
    ctx.moveTo(CANVAS_WIDTH / 2, CANVAS_HEIGHT / 3);
    ctx.lineTo(CANVAS_WIDTH / 2, CANVAS_HEIGHT);
    ctx.stroke();

    ctx.fillStyle = colors.neutral;
    ctx.fillRect(CANVAS_WIDTH - 180, 45, 172, 52);
    ctx.shadowColor = colors.primary;
    ctx.shadowOffsetX = 3;
    ctx.shadowOffsetY = 3;
    ctx.shadowBlur = 10;
    ctx.strokeRect(CANVAS_WIDTH - 180, 45, 172, 52);

    ctx.font = "bold 25px Arial"
    ctx.fillStyle = colors.bg_on_card
    ctx.fillText("Top 1%", CANVAS_WIDTH - 135, 80)


    //text
    // reset shadow
    ctx.shadowColor = "#00000000";
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;


    drawActivityRect(ctx)

  </script>
</html>
